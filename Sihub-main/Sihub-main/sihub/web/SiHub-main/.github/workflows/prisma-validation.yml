name: SiHub Prisma Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sihub
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/sihub

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Check migration SQL files
        run: |
          test -s prisma/migrations/migration_lock.toml
          grep -qx 'provider = "postgresql"' prisma/migrations/migration_lock.toml
          migrations=(
            20261104000000_initial
            20261104010000_password_reset_tokens
            20261104020000_schema_alignment
            20261107120000_education_records
            20261107150000_community_reactions
            20261107160000_media_asset_metadata
          )
          for migration in "${migrations[@]}"; do
            test -s "prisma/migrations/$migration/migration.sql"
          done
          test "$(find prisma/migrations -mindepth 2 -maxdepth 2 -name migration.sql -type f | wc -l)" -eq "${#migrations[@]}"
