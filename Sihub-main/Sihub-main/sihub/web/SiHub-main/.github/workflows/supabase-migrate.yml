name: SiHub Supabase Migration

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.SIHUB_DATABASE_URL }}
      DIRECT_URL: ${{ secrets.SIHUB_DIRECT_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check database secrets
        run: |
          test -n "$DATABASE_URL" || (echo "DATABASE_URL secret missing" && exit 1)
          test -n "$DIRECT_URL" || (echo "DIRECT_URL secret missing" && exit 1)

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Deploy Prisma migrations
        run: npx prisma migrate deploy
